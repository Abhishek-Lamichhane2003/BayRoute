name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e './backend[dev]'
      - run: ruff check backend
      - run: ruff format backend --check
      - run: pytest backend --cov=backend/bayroute --cov-fail-under=70

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/BayRoute
      - run: >-
          xcodebuild
          -project ios/BayRoute/BayRoute.xcodeproj
          -target BayRoute
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          SUPPORTED_PLATFORMS=iphonesimulator
          build
